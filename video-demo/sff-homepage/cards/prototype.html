<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>End card directions</title>
<link rel="stylesheet" href="/v2.css">
<link rel="stylesheet" href="/metacase.css">
<style>
  html, body { margin: 0; background: var(--bg-canvas); cursor: default; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg-canvas); color: var(--text-primary); font-family: var(--font-sans); }
  .grad { background: linear-gradient(100deg, var(--track-1), var(--mc-violet) 50%, var(--track-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .mono { font-family: var(--font-mono); }
  .up { animation: up 1.05s cubic-bezier(.16,1,.3,1) both, fade .8s cubic-bezier(.33,1,.68,1) both; animation-delay: var(--d, 0s); }
  @keyframes up { from { transform: translateY(10px); } }
  @keyframes fade { from { opacity: 0; filter: blur(4px); } }
  .crests { display: flex; align-items: center; gap: 28px; }
  .crests img, .crests span { flex: none; }
  .pagebg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* Margin: type and one quiet tile, nothing else */
  .m-end { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 460px; column-gap: 96px; align-items: center; padding: 0 144px; }
  .m-title { font-size: 168px; line-height: .98; letter-spacing: -.045em; font-weight: 650; margin: 0; }
  .m-title em { display: block; font-style: normal; padding-bottom: .12em; margin-bottom: -.12em; }
  .m-host { margin: 48px 0 0; font-size: 34px; color: var(--text-secondary); letter-spacing: -.01em; }
  .m-tile { background: #F1F5FA; border-radius: 28px; padding: 40px; }
  .m-tile svg { display: block; width: 100%; height: auto; }
  .m-cta { margin: 28px 0 0; font-size: 40px; font-weight: 650; letter-spacing: -.02em; }
  .m-url { margin: 6px 0 0; font-size: 26px; color: var(--text-secondary); }
  .m-mark { position: absolute; left: 72px; top: 54px; display: flex; align-items: center; gap: 16px; font-family: var(--font-mono); font-size: 30px; color: var(--text-tertiary); text-transform: uppercase; }
  .m-mark span { display: inline-grid; place-items: center; min-width: 58px; height: 46px; border-radius: 9px; border: 1.5px solid var(--mc-line); color: var(--text-primary); }

  /* Bookplate: the page's cream stock, as a closed Metacase */
  .b-end { position: absolute; inset: 0; background: #F4ECD8; color: #1b2230; display: grid; grid-template-columns: 1fr 1fr; }
  .b-end::before { content: ""; position: absolute; inset: 36px; border: 3px solid #C9B98F; border-radius: 10px; pointer-events: none; }
  .b-end::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: linear-gradient(90deg, #d8cba9, #efe6cf); }
  .b-left { padding: 180px 96px 0 132px; }
  .b-title { font-size: 128px; line-height: 1; letter-spacing: -.04em; font-weight: 650; margin: 0; color: #111827; }
  .b-title em { display: block; font-style: normal; color: oklch(52% 0.10 200); }
  .b-host { margin: 44px 0 0; font-size: 32px; color: #4b5563; }
  .b-right { display: grid; align-content: center; justify-items: center; }
  .b-right svg { width: 440px; height: 440px; }
  .b-url { margin: 28px 0 0; font-size: 30px; color: #374151; }
  .b-cta { margin: 0 0 32px; font-size: 44px; font-weight: 650; letter-spacing: -.02em; color: #111827; }
  .b-tab { position: absolute; left: 96px; top: 0; width: 120px; padding: 18px 0 26px; text-align: center; background: var(--track-1); color: #05070E; font-family: var(--font-mono); font-size: 34px; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 86%, 0 100%); }

  /* Signature: centred, built from the mark and the rail */
  .s-end { position: absolute; inset: 0; display: grid; justify-items: center; align-content: center; text-align: center; }
  .s-logo { width: 148px; height: 148px; margin-bottom: 24px; }
  .s-title { font-size: 136px; line-height: 1; letter-spacing: -.045em; font-weight: 650; margin: 0; }
  .s-host { margin: 28px 0 0; font-size: 32px; color: var(--text-secondary); }
  .s-foot { display: flex; align-items: center; gap: 56px; margin-top: 52px; text-align: left; }
  .s-qr { width: 300px; height: 300px; padding: 22px; background: #F1F5FA; border-radius: 20px; box-sizing: border-box; }
  .s-cta { font-size: 44px; font-weight: 650; letter-spacing: -.02em; margin: 0; }
  .s-url { margin: 8px 0 0; font-size: 28px; color: var(--text-secondary); }
  .s-rail { position: absolute; left: 0; right: 0; bottom: 44px; display: flex; justify-content: center; gap: 8px; font-size: 26px; }
  .s-rail i { font-style: normal; padding: 12px 22px; border: 1.5px solid var(--mc-line); border-radius: 12px; color: var(--text-tertiary); font-family: var(--font-mono); }
  .s-rail i.on { color: var(--text-primary); background: color-mix(in oklab, var(--track-1) 22%, transparent); border-color: var(--track-1); translate: 0 -8px; }

  /* picker: verbatim from PICKER.md */
  .proto-picker { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10, 10, 10, 0.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
  .proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); will-change: transform; }
  .proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1), width 250ms cubic-bezier(0.23, 1, 0.32, 1); }
  @media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } }
  .proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, 0.55); font: inherit; cursor: pointer; transition: color 150ms ease-out; }
  .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
  .proto-picker-item:active { transform: scale(0.97); }
  .proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
  .proto-picker-item[data-active] { color: #fff; }
  .proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
  .proto-picker-replay { padding: 0 10px; font-size: 14px; }
  .proto-picker[data-position="top"] { bottom: auto; top: 24px; }
  body.shoot .proto-picker { display: none; }
</style>
</head>
<body>
<div id="stage"></div>
<nav class="proto-picker" aria-label="Prototype variants" data-position="top">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Margin</button>
  <button class="proto-picker-item">Bookplate</button>
  <button class="proto-picker-item">Signature</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>
<script type="module">
  const qr = await (await fetch('qr.svg')).text();
  const crests = `<div class="crests"><span class="ntu-crest" style="display:block;width:66px;height:84px;overflow:hidden"><img src="/assets/institutions/ntu-university-official.png" style="height:84px;max-width:none"></span><img src="/assets/institutions/hku-university-crest.png" style="height:84px"><span class="sufe-crest" style="display:block;width:87px;height:84px"></span></div>`;
  const q = new URLSearchParams(location.search), part = q.get('part') || 'end';
  const url = 'easonai-5589.github.io/metacase-challenge';
  const bg = `<img class="pagebg" src="../out/review/probe-stage/1280-arch.jpg">`;
  const logo = `<svg class="s-logo" viewBox="0 0 32 32"><path d="M7.6 24.5 16 9.9" stroke="oklch(80% 0.12 195)" stroke-width="2" stroke-linecap="round"/><path d="M24.4 24.5 16 9.9" stroke="oklch(82% 0.14 75)" stroke-width="2" stroke-linecap="round"/><circle cx="7.6" cy="24.5" r="3" fill="oklch(80% 0.12 195)"/><circle cx="24.4" cy="24.5" r="4.2" fill="oklch(82% 0.14 75)"/><circle cx="16" cy="9.9" r="5.4" fill="#F1F5FA"/></svg>`;
  const variants = [
    () => part === 'mark' ? `${bg}<div class="m-mark up"><span>02</span>Retrieval</div>` : `<div class="m-end">
      <div><h1 class="m-title up">Metacase <em class="grad">Challenge</em></h1><div class="up" style="--d:.2s;margin-top:56px">${crests}</div><p class="m-host up" style="--d:.28s">Hosted by NTU GIFTS · with HKU and SUFE</p></div>
      <div class="up" style="--d:.45s"><div class="m-tile">${qr}</div><p class="m-cta">Join the Challenge</p><p class="m-url mono">${url}</p></div></div>`,
    () => part === 'mark' ? `${bg}<div class="b-tab up">02</div>` : `<div class="b-end">
      <div class="b-left"><h1 class="b-title up">Metacase <em>Challenge</em></h1><div class="up" style="--d:.2s;margin-top:64px">${crests}</div><p class="b-host up" style="--d:.28s">Hosted by NTU GIFTS · with HKU and SUFE</p></div>
      <div class="b-right up" style="--d:.45s"><p class="b-cta">Join the Challenge</p>${qr.replace('<svg', '<svg width="440" height="440"')}<p class="b-url mono">${url}</p></div></div>`,
    () => part === 'mark' ? `${bg}<div class="s-rail up"><i>01</i><i class="on">02 Retrieval</i><i>03</i><i>04</i><i>05</i><i>06</i><i>07</i><i>08</i></div>` : `<div class="s-end">
      <div class="up">${logo}</div><h1 class="s-title up" style="--d:.12s">Metacase <span class="grad">Challenge</span></h1><p class="s-host up" style="--d:.28s">Hosted by NTU GIFTS · with HKU and SUFE</p>
      <div class="s-foot up" style="--d:.45s"><div class="s-qr">${qr}</div><div><p class="s-cta">Join the Challenge</p><p class="s-url mono">${url}</p></div></div></div>`,
  ];
  const stage = document.getElementById('stage'), picker = document.querySelector('.proto-picker'), highlight = picker.querySelector('.proto-picker-highlight');
  const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')], replay = picker.querySelector('.proto-picker-replay');
  let current = 0;
  function moveHighlight() { const el = items[current]; highlight.style.width = el.offsetWidth + 'px'; highlight.style.transform = `translateX(${el.offsetLeft}px)`; }
  function mount(i) { stage.innerHTML = ''; requestAnimationFrame(() => { stage.innerHTML = variants[i](); }); }
  function setActive(i) {
    if (i < 0 || i >= variants.length) return;
    current = i;
    items.forEach((el, j) => { el.toggleAttribute('data-active', j === i); if (j === i) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current'); });
    moveHighlight();
    const u = new URL(location); u.searchParams.set('v', i + 1); history.replaceState(null, '', u);
    mount(i);
  }
  items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
  replay?.addEventListener('click', () => mount(current));
  window.addEventListener('resize', moveHighlight);
  document.addEventListener('keydown', e => {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const num = parseInt(e.key, 10);
    if (num >= 1 && num <= variants.length) setActive(num - 1);
    else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
    else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
    else if (e.key === 'r' || e.key === 'R') mount(current);
  });
  if (q.has('shoot')) document.body.classList.add('shoot');
  setActive((parseInt(q.get('v'), 10) || 1) - 1);
  requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
